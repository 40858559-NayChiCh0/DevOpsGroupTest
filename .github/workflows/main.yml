
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - master

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn -Dtest=com.napier.MainTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Start MySQL Database
        run: docker compose up -d db

      - name: Wait for MySQL Database
        run: |
          echo "Waiting for the world database..."
          for i in {1..30}; do
            if docker compose exec -T db sh -c \
              'mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE world; SELECT COUNT(*) FROM city;"' \
              > /dev/null 2>&1; then
              echo "MySQL database is ready!"
              exit 0
            fi
            echo "Attempt $i: MySQL not ready yet"
            sleep 3
          done
          docker compose logs db
          exit 1

      - name: Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: '33060'
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devops
        run: mvn -Dtest=com.napier.MainIntegrationTest test

      - name: Show MySQL Logs on Failure
        if: failure()
        run: docker compose logs db

      - name: Stop MySQL Database
        if: always()
        run: docker compose down

  build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package Application
        run: mvn package -DskipTests

      - name: Build and Run Docker Compose
        run: docker compose up --build --abort-on-container-exit

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down
