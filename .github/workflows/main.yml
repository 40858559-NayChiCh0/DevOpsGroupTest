name: A workflow for Population Report System

on:
  push:

jobs:
  build:
    name: Population Report action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Check JAR file
        run: |
          echo "Checking target directory..."
          ls -la target
          test -f target/devops.jar
          echo "devops.jar found successfully!"

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: devopsimage:latest
          load: true

      - name: Run Docker Container
        run: |
          docker run --name devopscontainer -d devopsimage:latest

      - name: View Container Logs
        run: |
          docker logs devopscontainer