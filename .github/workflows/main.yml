
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - lab08

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Integration Tests and Code Coverage
        run: |
          docker build -t database ./db
          docker run --name employees -dp 33060:3306 database
          mvn -Dtest=com.napier.devops.AppIntegrationTest test

      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: integration-tests
          fail_ci_if_error: false
          verbose: true

      - name: Clean Up Integration Database
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package with Maven
        run: mvn clean package -DskipTests

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --exit-code-from app

      - name: View Container Logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color app db

      - name: Clean Up
        if: always()
        run: docker compose -f docker-compose.yml down -v
