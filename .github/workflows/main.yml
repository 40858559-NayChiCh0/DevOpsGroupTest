
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - master

jobs:

  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn -Dtest=com.napier.MainTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build MySQL Database Image
        run: docker build -t database ./db

      - name: Start MySQL Database
        run: docker run --name employees -dp 33060:3306 database

      - name: Wait for MySQL Database
        run: sleep 30

      - name: Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: "33060"
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devops
        run: mvn -Dtest=com.napier.MainIntegrationTest test

      - name: View MySQL Logs on Failure
        if: failure()
        run: docker logs employees || true

      - name: Cleanup Database
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

  build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package Application
        run: mvn package -DskipTests

      - name: Build and Run Docker Compose
        run: docker compose up --build --abort-on-container-exit

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down
