name: A workflow for population Report System
on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - master

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Unit Tests
        run: mvn -Dtest=com.napier.MainTest test
  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Integration Tests
        run: |
          docker build -t database ./db 
          docker run --name employees -dp 33060:3306 database
          mvn -Dtest=com.napier.MainIntegrationTest test
          docker stop devopsgrouptest-db-1
          docker rm devopsgrouptest-db-1
          docker image rm database  
          

  build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit
