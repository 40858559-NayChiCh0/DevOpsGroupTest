
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - lab08

jobs:
  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package with Maven
        run: mvn clean package -DskipTests

      - name: Check for JaCoCo Coverage Report
        id: coverage
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "JaCoCo coverage report found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No JaCoCo coverage report found."
            echo "Tests are required to generate coverage."
          fi

      - name: Upload Coverage Reports to Codecov
        if: steps.coverage.outputs.available == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: population-report
          fail_ci_if_error: false
          verbose: true

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --exit-code-from app

      - name: View Container Logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color app db

      - name: Clean Up
        if: always()
        run: docker compose -f docker-compose.yml down -v
